# ~/.config/fuzzel/fuzzel.ini
# Тема: Everforest Dark Medium

[main]
font=Bitstream Vera Sans Mono:size=12
icons-enabled=no
icon-theme=Papirus-Dark
image-size-ratio=0.5

prompt="(•‿•) "
placeholder="Looking for..."
width=40
tabs=4

# Геометрия и отступы
horizontal-pad=24
vertical-pad=16
inner-pad=10

[colors]
# Основной фон (bg0)
background=2d353bff
# Основной текст (fg)
text=d3c6aaff
# Текст совпадения при поиске (зеленый / green)
match=a7c080ff

# Фон выделенной строки (bg_visual)
selection=543a48ff
# Текст выделенной строки (fg)
selection-text=d3c6aaff
# Текст совпадения в выделенной строке (оранжевый / orange)
selection-match=e69875ff

# Рамка окна (grey1)
border=859289ff

[border]
width=2
radius=8

